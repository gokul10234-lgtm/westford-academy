<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | Westford Sports - Indian Academy</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="center-screen">
  <div class="card">
    <h1>Change Password</h1>
    <p class="sub" id="subText">Choose a new password for your account.</p>
    <form id="cpForm">
      <label for="oldPassword">Current Password</label>
      <input type="password" id="oldPassword" required>
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required minlength="6">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" required minlength="6">
      <button type="submit" class="btn btn-block">Update Password</button>
    </form>
    <div id="msg"></div>
    <p class="small-note" style="margin-top:16px"><a href="/index.html">Back to dashboard</a> · <a href="#" id="logoutLink">Log out</a></p>
  </div>
</div>
<script src="/api.js"></script>
<script>
  Auth.requireLogin();
  const params = new URLSearchParams(window.location.search);
  if (params.get('first') === '1') {
    document.getElementById('subText').textContent = 'This account is still using its default password. Please set a new one before continuing.';
  }
  document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

  document.getElementById('cpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.innerHTML = '';
    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      msg.innerHTML = '<div class="error-msg">New password and confirmation do not match.</div>';
      return;
    }
    try {
      await api('/auth/change-password', { method: 'POST', body: { oldPassword, newPassword } });
      msg.innerHTML = '<div class="success-msg">Password updated. Redirecting…</div>';
      setTimeout(() => window.location.href = '/index.html', 1200);
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
